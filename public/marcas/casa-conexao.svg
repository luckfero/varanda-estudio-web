<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img" aria-label="casa-conexao">
  <title>casa-conexao</title>
  <!-- Os dois circulos que se cruzam. UNICA MARCA REDESENHADA AQUI, porque no site ela nao e arquivo: sao dois span com border-radius 50% em clientes/casa-conexao/site/css/estilo.css, linhas 229 a 244. As medidas sao as de la: caixa de 34 por 22, circulos de 22 com borda de 2, o da esquerda em x 0 e o da direita em x 12. As cores sao as da variante invertida (linhas 371 e 372), nao as da variante clara do simbolo, que deixa o circulo direito em cobre e reprova a 2,75:1 sobre o verde. Creme 10.43:1 e terracota 5.02:1. -->
  <rect width="1600" height="1067" fill="#2E3A2C"/>
  <g transform="translate(598.40 403.06) scale(11.85854)">
    <g fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="10" stroke="#F4EFE6"/>
      <circle cx="23" cy="11" r="10" stroke="#D99A72"/>
    </g>
  </g>
</svg>
