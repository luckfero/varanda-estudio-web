<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- A soleira, em cor literal para FUNDO ESCURO.

       Mesma geometria de `simbolo.svg`, e ela precisa ficar igual: cobertura
       de vao 32 com pernas que PARAM em y 35, piso de vao 40 em y 49, e a
       folga entre os dois, que e a ideia inteira.

       Este arquivo existe porque o `simbolo.svg` pinta por currentColor, e
       currentColor so resolve com o SVG embutido na pagina. Como img, como
       fundo ou dentro de um cliente de e-mail o arquivo e documento isolado e
       o currentColor cai em preto, que sobre fundo escuro some.

       Cores: contorno #f4efe6, que mede 16,43:1 sobre o chao #14110e, e sol
       #e8a33c, que mede 8,72:1 no mesmo chao. Sobre papel branco este arquivo
       nao serve, e para papel existe o `simbolo.svg` herdando a tinta. -->
  <path d="M16 35V24a9 9 0 0 1 9-9h14a9 9 0 0 1 9 9v11"
        stroke="#f4efe6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 49h40" stroke="#f4efe6" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 46.5a8 8 0 0 1 16 0Z" fill="#e8a33c"/>
</svg>
