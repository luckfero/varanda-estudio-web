<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- Assinatura horizontal: símbolo mais nome.

       AVISO: o nome aqui é `<text>`, não contorno. Em máquina sem uma
       serifada da lista, o sistema substitui a fonte e a assinatura sai
       diferente. Para peça impressa ou entregue a terceiro, prefira o
       `simbolo.svg` com o nome digitado no próprio documento, onde a fonte
       está sob controle. Converter para contorno exige ferramenta de fonte
       que este projeto não tem. -->
  <g>
    <path d="M15 53V28a17 17 0 0 1 34 0v25" fill="none" stroke="#214d3b" stroke-width="5" stroke-linecap="round"/>
    <path d="M22.5 50.5a9.5 9.5 0 0 1 19 0Z" fill="#c79a43"/>
    <path d="M7 53h50" fill="none" stroke="#214d3b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="78" y="35" fill="#17382c" font-family="Iowan Old Style, Baskerville, Times New Roman, serif" font-size="31" letter-spacing="-0.6">Varanda</text>
  <text x="80" y="51" fill="#625b54" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="2.9">ESTÚDIO WEB</text>
</svg>
