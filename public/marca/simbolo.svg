<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- A soleira. Cobertura de vao 32 (x 16 a 48), coroa reta em y 15, ombros
       de raio 9, pernas de y 24 a y 35, onde PARAM. Piso de vao 40 (x 12 a
       52) em y 49. Luz de raio 8 deitada sobre o piso.

       A folga entre a perna e o piso e a ideia: cobertura suspensa sobre um
       piso e varanda, e nao porta nem sala.

       O contorno sai por currentColor para o simbolo herdar a superficie:
       creme sobre o chao escuro do site, quase preto sobre papel de proposta.
       ISSO SO FUNCIONA COM O SVG EMBUTIDO NA PAGINA. Como img, como
       background-image ou como favicon o arquivo e documento isolado e o
       currentColor cai em preto; nesses lugares vai o selo.

       A luz herda tambem, e nao fica travada em ocre, porque o #e8a33c mede
       2,16:1 sobre papel branco e reprova os 3:1 de elemento grafico. O ocre
       vive no selo e no favicon, onde o fundo e controlado. -->
  <path d="M16 35V24a9 9 0 0 1 9-9h14a9 9 0 0 1 9 9v11"
        stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 49h40" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 46.5a8 8 0 0 1 16 0Z" style="fill: var(--marca-luz, currentColor)"/>
</svg>
