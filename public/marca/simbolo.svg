<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- O arco: cobertura e dois pilares, aberto embaixo. -->
  <path d="M15 53V28a17 17 0 0 1 34 0v25" fill="none" stroke="#214d3b" stroke-width="5" stroke-linecap="round"/>
  <!-- O sol nascendo, visto de dentro da varanda. Meia-lua, e não círculo
       inteiro: o círculo fechava o vão e a marca lia como cadeado. -->
  <path d="M22.5 50.5a9.5 9.5 0 0 1 19 0Z" fill="#c79a43"/>
  <!-- O piso. É o que impede o arco de virar túnel ou ponte. -->
  <path d="M7 53h50" fill="none" stroke="#214d3b" stroke-width="5" stroke-linecap="round"/>
</svg>
