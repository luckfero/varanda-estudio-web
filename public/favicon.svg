<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- A soleira ABERTA, sem pastilha: a mesma geometria de
       `marca/simbolo.svg`, unidade por unidade, e a mesma que o cabeçalho do
       site desenha. Antes daqui a aba usava uma versão própria, com pastilha,
       vão de 24 e traço 6, ou seja, um terceiro desenho. Trocado em
       28/08/2026, a pedido, para a aba mostrar a mesma marca dos arquivos.

       A COR SEGUE O TEMA DA ABA, e é por isso que existe uma folha aqui
       dentro. Sem pastilha não há fundo próprio: creme sobre uma barra de
       abas clara sumiria, e tinta escura sobre uma barra escura sumiria
       igual. A consulta de mídia resolve, e é exatamente o par de arquivos
       que a pasta de entrega já tem, um para fundo claro e um para escuro.

       O sol só é âmbar no tema escuro. Sobre branco o âmbar mede 2,16:1 e
       reprova os 3:1 de elemento gráfico, então no tema claro ele sai na
       mesma tinta do contorno e quem separa o sol do arco é a forma. É a
       mesma regra do `marca/assinatura.svg`.

       Cor literal e não `currentColor`: favicon é documento isolado, nenhuma
       folha do site alcança ele, e `currentColor` cairia em preto. -->
  <style>
    .traco { fill: none; stroke: #14110e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .sol { fill: #14110e; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #f4efe6; }
      .sol { fill: #e8a33c; }
    }
  </style>
  <path class="traco" d="M16 35V24a9 9 0 0 1 9-9h14a9 9 0 0 1 9 9v11"/>
  <path class="traco" d="M12 49h40"/>
  <path class="sol" d="M24 46.5a8 8 0 0 1 16 0Z"/>
</svg>
