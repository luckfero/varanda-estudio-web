<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- A soleira, aprovada em 27/08/2026. Tres pecas: a cobertura que nao
       encosta, o piso mais largo que ela, e a luz entre os dois.

       Cor LITERAL, e nao currentColor: favicon e documento isolado, nenhuma
       folha do site alcanca ele, e currentColor cairia em preto sobre a
       pastilha escura. A mesma armadilha vale para o SVG usado como img ou
       como background-image.

       Traco de 6 em vez de 5 e vao mais aberto que o simbolo: em 16px, uma
       unidade do viewBox vale 0,25 pixel, entao o desenho de aba precisa de
       mais peso e mais folga que o de tela. -->
  <rect width="64" height="64" rx="14" fill="#262019"/>
  <path d="M20 36V27a8 8 0 0 1 8-8h8a8 8 0 0 1 8 8v9" fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 45.5a7 7 0 0 1 14 0Z" fill="#e8a33c"/>
  <path d="M15 47h34" fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round"/>
</svg>
