<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Varanda Estúdio Web">
  <title>Varanda Estúdio Web</title>
  <!-- Favicon: a mesma marca do cabeçalho, não outra.
       Até 2026-08-11 aqui vivia um "V" com folha, e o topo do site mostrava
       um círculo com folhas. Eram dois símbolos diferentes para a mesma
       empresa, e quem via a aba do navegador e depois a página via os dois.

       A geometria é a do `marca/simbolo.svg` com traço mais grosso e mais
       respiro: em 16px, que é o tamanho real de uma aba, traço fino sumiria. -->
  <rect width="64" height="64" rx="14" fill="#214d3b"/>
  <path d="M20 45V31a12 12 0 0 1 24 0v14" fill="none" stroke="#f4efe6" stroke-width="5" stroke-linecap="round"/>
  <path d="M26 42.5a6 6 0 0 1 12 0Z" fill="#dcb668"/>
  <path d="M14 45h36" fill="none" stroke="#f4efe6" stroke-width="5" stroke-linecap="round"/>
</svg>
